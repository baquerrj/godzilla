# REQ: SEC-DATA-004

services:
  init-perms:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    user: root
    command: >
      bash -lc '
      mkdir -p /workspace /home/vscode/.local/share/godzilla /home/vscode/.cache/pip /home/vscode/.npm /usr/local/cargo/registry /usr/local/cargo/git &&
      chown -R ${LOCAL_UID:-1000}:${LOCAL_GID:-1000} /workspace /home/vscode/.local/share/godzilla /home/vscode/.cache/pip /home/vscode/.npm /usr/local/cargo/registry /usr/local/cargo/git
      '
    volumes:
      - godzilla-workspace:/workspace
      - godzilla-data:/home/vscode/.local/share/godzilla
      - godzilla-pip-cache:/home/vscode/.cache/pip
      - godzilla-npm-cache:/home/vscode/.npm
      - godzilla-cargo-registry:/usr/local/cargo/registry
      - godzilla-cargo-git:/usr/local/cargo/git
    restart: "no"

  dev:
    container_name: godzilla-dev
    depends_on:
      init-perms:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    command: sleep infinity
    stdin_open: true
    tty: true
    volumes:
      - godzilla-workspace:/workspace
      - godzilla-data:/home/vscode/.local/share/godzilla
      - godzilla-pip-cache:/home/vscode/.cache/pip
      - godzilla-npm-cache:/home/vscode/.npm
      - godzilla-cargo-registry:/usr/local/cargo/registry
      - godzilla-cargo-git:/usr/local/cargo/git
    # Secrets are injected from an env file that is never committed.
    # Set GODENV_FILE to an absolute path, or symlink .godenv in the
    # repo root to your credentials file:
    #   ln -sf /home/baquerrj/projects/godzila/.godenv .godenv
    # Expected keys: GODZILLA_DB_KEY, GODZILLA_SECRETS_KEY,
    #   GODZILLA_API_TOKEN, PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENV
    env_file:
      - path: "${GODENV_FILE:-.godenv}"
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GODZILLA_DB_PATH: /home/vscode/.local/share/godzilla/godzilla.db
      GODZILLA_SECRETS_PATH: /home/vscode/.local/share/godzilla/secrets.db
    ports:
      - "8787:8787"
      - "8443:8443"

volumes:
  godzilla-workspace:
  godzilla-data:
  godzilla-pip-cache:
  godzilla-npm-cache:
  godzilla-cargo-registry:
  godzilla-cargo-git:
