# REQ: SEC-DATA-004

services:
  dev:
    container_name: godzilla-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    command: sleep infinity
    stdin_open: true
    tty: true
    volumes:
      - godzilla-workspace:/workspace
      - godzilla-data:/home/vscode/.local/share/godzilla
      - godzilla-pip-cache:/home/vscode/.cache/pip
      - godzilla-npm-cache:/home/vscode/.npm
      - godzilla-cargo-registry:/usr/local/cargo/registry
      - godzilla-cargo-git:/usr/local/cargo/git
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GODZILLA_DB_PATH: /home/vscode/.local/share/godzilla/godzilla.db
      GODZILLA_SECRETS_PATH: /home/vscode/.local/share/godzilla/secrets.db
    ports:
      - "8787:8787"
      - "8443:8443"

volumes:
  godzilla-workspace:
  godzilla-data:
  godzilla-pip-cache:
  godzilla-npm-cache:
  godzilla-cargo-registry:
  godzilla-cargo-git:
