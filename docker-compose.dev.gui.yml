# REQ: SEC-DATA-004

services:
  dev:
    environment:
      # Forward host X11 display into the container for GUI apps such as Tauri.
      DISPLAY: ${DISPLAY:-:0}
      # Default to X11 with hardware acceleration when available.
      GDK_BACKEND: x11
      XDG_SESSION_TYPE: x11
      # Optional compatibility mode knobs for problematic hosts.
      # Set to 1 only when needed to work around display/GPU instability.
      LIBGL_ALWAYS_SOFTWARE: ${GODZILLA_GUI_SOFTWARE_RENDERING:-0}
      WEBKIT_DISABLE_COMPOSITING_MODE: ${GODZILLA_GUI_DISABLE_COMPOSITING:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
