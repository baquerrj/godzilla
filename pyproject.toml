[build-system]
requires = ["setuptools>=82,<83", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "godzilla-core"
version = "0.1.0"
description = "Core services for the Godzilla personal budgeting app."
readme = "docs/vision.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.135,<0.136",
  "python-multipart>=0.0.20,<0.1",
  "PyYAML>=6,<7",
  "sqlcipher3-binary==0.6.0",
  "uvicorn>=0.44,<0.45",
]

[project.scripts]
link-sandbox-item = "godzilla_core.scripts.link_sandbox_item:main"
migrations = "godzilla_core.db.migrations:main"
sync-plaid-item = "godzilla_core.scripts.sync_plaid_item:main"
godzilla-api = "godzilla_core.scripts.run_api_server:main"
visualize-requirements = "godzilla_core.scripts.visualize_requirements:main"
seed-benchmark-dataset = "godzilla_core.scripts.seed_benchmark_dataset:main"

[project.optional-dependencies]
dev = [
  "black>=24.10,<25",
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
  "pytest-cov>=6.3,<7",
  "ruff>=0.15,<0.16",
]

[tool.setuptools]
packages = {find = {where = ["."], exclude = ["godzilla_core/tests", "godzilla_core/tests.*"]}}

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["godzilla_core"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "PL", "D", "I"]
ignore = ["D206"]

[tool.ruff.lint.per-file-ignores]
"godzilla_core/tests/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
  )s
)
'''

[tool.pytest.ini_options]
testpaths = ["godzilla_core/tests"]
addopts = "--cov=godzilla_core --cov-report=term-missing"
